/* Web addresses on GitHub Pages are case-sensitive. Send saikia.in/sta102/bisem2026/ and similar
   spellings to the real folder. Add new course folders to KNOWN, longest first. */
(function () {
  var KNOWN = ['/STA102/BiSem2026/', '/STA102/'];
  var p = location.pathname;
  if (p.slice(-1) !== '/' && p.split('/').pop().indexOf('.') === -1) p += '/';
  var lp = p.toLowerCase();
  for (var i = 0; i < KNOWN.length; i++) {
    var k = KNOWN[i];
    if (lp.indexOf(k.toLowerCase()) === 0) {
      var fixed = k + lp.slice(k.length);
      if (fixed !== location.pathname) location.replace(fixed + location.search + location.hash);
      return;
    }
  }
})();
</script>
